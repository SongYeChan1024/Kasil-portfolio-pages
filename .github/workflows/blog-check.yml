name: Blog checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: blog-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install preview dependencies
        run: |
          npm install --global pnpm@11.25.0
          pnpm --dir tools/category-preview install --frozen-lockfile
      - name: Test editor, cache and category menus
        run: node --test tools/editor-regression.test.mjs tools/cache-regression.test.mjs tools/category-regression.test.mjs
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
          bundler-cache: true
      - name: Build site
        run: bundle exec jekyll build --destination _site/Kasil_DevLog
        env:
          JEKYLL_ENV: production
      - name: Check generated links
        run: bundle exec htmlproofer _site --disable-external
